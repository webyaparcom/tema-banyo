<section class="modulex-testi2">
  <div class="modulex-testi2-container">
    <div class="modulex-testi2-header">
      <div class="modulex-testi2-badge">{{badge}}</div>
      <h2 class="modulex-testi2-title">{{title}}</h2>
    </div>
    <div class="swiper-container modulex">
      <div class="swiper-wrapper">{{html}}</div>
      <div class="swiper-pagination modulex-testi2-pagination"></div>
    </div>
  </div>
</section>

<style>
  .modulex-testi2 {
    width: 100%;
    padding: 70px 20px;
    background: --bgcolor--;
    box-sizing: border-box;
  }

  .modulex-testi2-container {
    max-width: --max--;
    margin: 0 auto;
  }

  .modulex-testi2-header {
    text-align: center;
    margin-bottom: 36px;
  }

  .modulex-testi2-badge {
    display: inline-block;
    padding: 6px 18px;
    background: --accent--;
    color: --accentText--; /* 31 Eki: sabit beyaz → token */
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
  }

  .modulex-testi2-title {
    font-size: 32px;
    font-weight: 800;
    color: --titlecolor--;
    margin: 0;
  }

  .modulex-testi2 .swiper-container {
    overflow: hidden;
    padding-bottom: 40px;
  }

  .modulex-testi2-card {
    background: --cardbg--;
    border: 1px solid --bordercolor--;
    border-radius: 16px;
    padding: 26px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-sizing: border-box;
    height: auto;
    transition: box-shadow 0.3s ease;
  }

  .modulex-testi2-card:hover {
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
  }

  .modulex-testi2-stars {
    color: --starcolor--;
    font-size: 15px;
    letter-spacing: 2px;
  }

  .modulex-testi2-text {
    font-size: 14px;
    line-height: 1.75;
    color: --textcolor--;
    margin: 0;
    flex: 1;
  }

  .modulex-testi2-person {
    display: flex;
    align-items: center;
    gap: 12px;
    border-top: 1px solid --bordercolor--;
    padding-top: 14px;
  }

  .modulex-testi2-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: --accent--;
    color: --accentText--; /* 31 Eki: sabit beyaz → token */
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
    overflow: hidden;
  }

  .modulex-testi2-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .modulex-testi2-name {
    font-size: 15px;
    font-weight: 700;
    color: --titlecolor--;
  }

  .modulex-testi2-role {
    font-size: 12px;
    color: --textcolor--;
  }

  .modulex-testi2-pagination .swiper-pagination-bullet-active {
    background: --accent--;
  }

  @keyframes modulexTesti2In {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .modulex-testi2 {
    animation: modulexTesti2In 0.5s ease both;
  }

  @media (max-width: 768px) {
    .modulex-testi2 {
      padding: 44px 14px;
    }

    .modulex-testi2-title {
      font-size: 24px;
    }

    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

<script>
  setTimeout(function () {
    (function testi2Init() {
      var attempts = 0;
      var timer = setInterval(function () {
        attempts++;
        if (typeof Swiper === "function") {
          clearInterval(timer);
          new Swiper(".modulex", {
            slidesPerView: 1,
            spaceBetween: 20,
            loop: true,
            autoHeight: false,
            breakpoints: {
              640: { slidesPerView: 2 },
              1024: { slidesPerView: 3 }
            },
            autoplay: {
              delay: 4500,
              disableOnInteraction: true
            },
            pagination: {
              el: ".modulex-testi2-pagination",
              clickable: true
            }
          });
        } else if (attempts >= 20) {
          clearInterval(timer);
        }
      }, 250);
    })();
  }, 100);
</script>
